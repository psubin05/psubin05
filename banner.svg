<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Subin Park — AI Developer and Robotics Engineer</title>
  <desc id="desc">Portfolio header highlighting AI engineering, robotics, Korean NLP, autonomous driving, and multi-robot systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="278" rx="23" fill="url(#bg)" stroke="#e2e8f0" stroke-width="2"/>
  <path d="M0 246C224 202 380 273 598 240S972 189 1200 225V280H0Z" fill="#e2e8f0" opacity="0.5"/>
  <path d="M0 258C224 218 392 283 618 253S980 205 1200 239" fill="none" stroke="#06b6d4" stroke-opacity="0.22" stroke-width="2"/>

  <rect x="48" y="38" width="228" height="32" rx="16" fill="#ecfeff" stroke="#a5f3fc"/>
  <circle cx="68" cy="54" r="5" fill="#06b6d4"/>
  <text x="82" y="60" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#0e7490">AI · ROBOTICS · RESEARCH</text>

  <text x="48" y="139" font-family="Arial, sans-serif" font-size="68" font-weight="700" fill="#0f172a">Subin Park</text>
  <text x="51" y="188" font-family="Arial, sans-serif" font-size="29" font-weight="600" fill="#334155">AI Developer <tspan fill="#0891b2">&amp;</tspan> Robotics Engineer</text>
  <text x="51" y="226" font-family="Arial, sans-serif" font-size="18" fill="#64748b">Korean NLP · Autonomous Driving · Multi-Robot Systems</text>

  <g transform="translate(825 42)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M45 54L151 21L254 67L207 168L92 183L45 54Z" stroke="#94a3b8" stroke-opacity="0.65" stroke-width="2"/>
    <path d="M45 54L156 108L254 67M156 108L92 183M156 108L207 168M151 21L156 108" stroke="#06b6d4" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <circle cx="45" cy="54" r="12" fill="#ffffff" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="151" cy="21" r="9" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="254" cy="67" r="12" fill="#ffffff" stroke="#06b6d4" stroke-width="3"/>
    <circle cx="156" cy="108" r="20" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.45">
      <animate attributeName="r" values="20;31;20" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0;0.5" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="156" cy="108" r="18" fill="#ffffff" stroke="url(#accent)" stroke-width="4" filter="url(#glow)">
      <animate attributeName="r" values="18;19.5;18" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="92" cy="183" r="11" fill="#ffffff" stroke="#3b82f6" stroke-width="3"/>
    <circle cx="207" cy="168" r="11" fill="#ffffff" stroke="#06b6d4" stroke-width="3"/>
    <path d="M145 108h22M156 97v22" stroke="#0e7490" stroke-width="3"/>
