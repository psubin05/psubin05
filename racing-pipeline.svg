<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">F1TENTH adaptive racing control pipeline</title>
  <desc id="desc">LiDAR scan flows through TinyLidarNet and adaptive control to an Ackermann drive command.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4f8fc9"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="1198" height="418" rx="24" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="65" fill="#4f8fc9" font-size="17" font-weight="700" letter-spacing="2">F1TENTH · AUTONOMOUS RACING</text>
    <text x="52" y="110" fill="#172033" font-size="34" font-weight="700">Adaptive Racing Control</text>
    <g fill="#f8fafc" stroke="#dce3eb" stroke-width="2">
      <rect x="52" y="160" width="220" height="150" rx="18"/>
      <rect x="340" y="160" width="220" height="150" rx="18"/>
      <rect x="628" y="160" width="220" height="150" rx="18"/>
      <rect x="916" y="160" width="220" height="150" rx="18"/>
    </g>
    <g fill="none" stroke="#4f8fc9" stroke-width="3" marker-end="url(#arrow)">
      <path d="M285 235H324"/>
      <path d="M573 235H612"/>
      <path d="M861 235H900"/>
    </g>
    <g text-anchor="middle">
      <text x="162" y="205" fill="#4f8fc9" font-size="15" font-weight="700">01</text>
      <text x="162" y="244" fill="#172033" font-size="24" font-weight="700">LiDAR Scan</text>
      <text x="162" y="277" fill="#7b8798" font-size="17">/scan</text>
      <text x="450" y="205" fill="#4f8fc9" font-size="15" font-weight="700">02</text>
      <text x="450" y="244" fill="#172033" font-size="24" font-weight="700">TinyLidarNet</text>
      <text x="450" y="277" fill="#7b8798" font-size="17">inference</text>
      <text x="738" y="205" fill="#4f8fc9" font-size="15" font-weight="700">03</text>
      <text x="738" y="244" fill="#172033" font-size="24" font-weight="700">Adaptive Control</text>
      <text x="738" y="277" fill="#7b8798" font-size="17">speed + steering</text>
      <text x="1026" y="205" fill="#4f8fc9" font-size="15" font-weight="700">04</text>
      <text x="1026" y="244" fill="#172033" font-size="24" font-weight="700">Drive Command</text>
      <text x="1026" y="277" fill="#7b8798" font-size="17">/drive</text>
    </g>
    <line x1="52" y1="355" x2="1148" y2="355" stroke="#edf0f4" stroke-width="2"/>
    <text x="52" y="387" fill="#7b8798" font-size="17">ROS 2 · NVIDIA Jetson · LiDAR-aware speed and steering control</text>
  </g>
</svg>
